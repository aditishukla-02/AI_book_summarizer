<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Document Summarizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      overflow: hidden;
    }
    
    /* Ambient Background Glow */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
    }
    .shape1 { width: 400px; height: 400px; background: rgba(99, 102, 241, 0.25); top: -100px; left: -100px; }
    .shape2 { width: 300px; height: 300px; background: rgba(168, 85, 247, 0.25); bottom: -50px; right: -50px; }

    /* Glassmorphism Card */
    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 480px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    h2 { 
      margin-top: 0; 
      font-size: 1.8rem; 
      font-weight: 600; 
      background: linear-gradient(to right, #818cf8, #c084fc); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      margin-bottom: 0.5rem; 
    }
    .subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 2rem; }

    /* Interactive Dropzone */
    .dropzone {
      border: 2px dashed rgba(129, 140, 248, 0.4);
      background: rgba(15, 23, 42, 0.4);
      padding: 2.5rem 1.5rem;
      border-radius: 16px;
      cursor: pointer;
      margin-bottom: 1.5rem;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.1);
    }
    .dropzone svg {
      width: 50px; 
      height: 50px; 
      fill: #818cf8; 
      margin-bottom: 1rem; 
      transition: transform 0.3s ease;
    }
    .dropzone:hover svg, .dropzone.dragover svg { transform: translateY(-5px); fill: #a855f7; }
    
    .file-name {
      color: #f8fafc;
      font-weight: 500;
      margin-top: 0.5rem;
      word-break: break-all;
    }
    
    input[type="file"] { display: none; }
    
    /* Gradient Button */
    .btn {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      color: #fff;
      width: 100%;
      border: none;
      padding: 1rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }
    .btn:hover {
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.5);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>
  
  <div class="card">
    <h2>AI Book Summarizer</h2>
    <p class="subtitle">Extract insights from any PDF or TXT</p>
    
    <form action="/upload" method="POST" enctype="multipart/form-data">
      <label class="dropzone" id="drop-area" for="file-upload">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6zm5-4.59L8.71 13.3a.996.996 0 1 1 1.41-1.41L11 12.76V9c0-.55.45-1 1-1s1 .45 1 1v3.76l.88-.88a.996.996 0 1 1 1.41 1.41L12 15.41z"/></svg>
        <span id="label-text">Drag & drop your file here or click to browse</span>
        <span class="file-name" id="file-name-display"></span>
      </label>
      <input id="file-upload" type="file" name="document" accept=".pdf,.txt" required>
      <button class="btn" type="submit">Upload & Process</button>
    </form>
  </div>

  <script>
    const fileInput = document.getElementById('file-upload');
    const fileNameDisplay = document.getElementById('file-name-display');
    const labelText = document.getElementById('label-text');
    const dropArea = document.getElementById('drop-area');

    // Handle standard file selection
    fileInput.addEventListener('change', function(e) {
      if (this.files && this.files[0]) {
        labelText.style.display = 'none';
        fileNameDisplay.textContent = this.files[0].name;
      } else {
        labelText.style.display = 'inline';
        fileNameDisplay.textContent = '';
      }
    });

    // Handle Drag & Drop Events
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropArea.addEventListener(eventName, preventDefaults, false);
    });

    function preventDefaults (e) {
      e.preventDefault();
      e.stopPropagation();
    }

    ['dragenter', 'dragover'].forEach(eventName => {
      dropArea.addEventListener(eventName, () => {
        dropArea.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropArea.addEventListener(eventName, () => {
        dropArea.classList.remove('dragover');
      }, false);
    });

    dropArea.addEventListener('drop', (e) => {
      let dt = e.dataTransfer;
      let files = dt.files;
      fileInput.files = files; // Assign dragged files to input
      
      if (files && files[0]) {
        labelText.style.display = 'none';
        fileNameDisplay.textContent = files[0].name;
      }
    }, false);
  </script>
</body>
</html>
